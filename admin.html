<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Watch - Admin Broadcast</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e8eaed;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem}
.card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:2rem;max-width:500px;width:100%}
.card h1{font-size:1.3rem;font-weight:900;color:#64B5F6;margin-bottom:0.3rem;text-align:center}
.card p{color:rgba(255,255,255,0.4);font-size:0.85rem;margin-bottom:1.2rem;text-align:center}
label{display:block;font-size:0.8rem;font-weight:700;color:rgba(255,255,255,0.5);margin-bottom:0.3rem}
input,textarea{width:100%;padding:0.7rem;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e8eaed;font-size:0.9rem;font-family:inherit;margin-bottom:0.8rem}
textarea{min-height:80px;resize:vertical}
.btn{width:100%;padding:0.8rem;border-radius:8px;border:none;background:linear-gradient(135deg,#1a73e8,#4a90d9);color:#fff;font-size:0.9rem;font-weight:800;cursor:pointer;font-family:inherit;transition:all 0.3s}
.btn:hover{transform:translateY(-1px)}
.status{text-align:center;margin-top:0.5rem;font-size:0.85rem;min-height:1.5em}
.back{text-align:center;margin-top:1rem;font-size:0.8rem}
.back a{color:rgba(255,255,255,0.3);text-decoration:none}
.back a:hover{color:#64B5F6}
.lock{text-align:center;font-size:0.7rem;color:rgba(255,255,255,0.1);margin-top:1rem}
</style>
</head>
<body>
<div class="card">
  <h1>📢 Broadcast to All Users</h1>
  <p>Send a push notification to every Community Watch user.</p>

  <label>Title</label>
  <input type="text" id="title" placeholder="e.g. Fire danger warning" maxlength="100">

  <label>Message</label>
  <textarea id="body" placeholder="Type your message to the community..."></textarea>

  <button class="btn" id="sendBtn">📤 Send Broadcast</button>
  <div class="status" id="status"></div>

  <div class="back"><a href="/">← Back to Community Watch</a></div>
  <div class="lock">🔒 Admin only - bookmark this page</div>
</div>

<script>
var SB='https://lhnboiojwfapjnxjxjep.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobmJvaW9qd2ZhcGpueGp4amVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1ODU0MzksImV4cCI6MjEwMDE2MTQzOX0.yft1qubqbKGbkzb2qjYjk3UPQjEWV_1YIRD9MbO_-2k';

document.getElementById('sendBtn').onclick = function(){
  var t=document.getElementById('title').value.trim()||'Community Watch';
  var b=document.getElementById('body').value.trim();
  var st=document.getElementById('status');
  if(!b){st.textContent='Please enter a message';st.style.color='#fdd835';return;}
  
  st.textContent='⏳ Sending...';
  st.style.color='#64B5F6';
  
  var broadcastId=Date.now();
  fetch(SB+'/rest/v1/broadcasts',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apiKey':KEY,
      'Authorization':'Bearer '+KEY
    },
    body:JSON.stringify({id:broadcastId,title:t,body:b,time:new Date().toISOString()})
  });
  // Also save to alerts feed so it shows in users' app feeds
  fetch(SB+'/rest/v1/alerts',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'apiKey':KEY,
      'Authorization':'Bearer '+KEY
    },
    body:JSON.stringify({id:broadcastId+1,type:'community',title:'📢 '+t,description:b,location:'Lakes Entrance',time:new Date().toISOString()})
  }).catch(function(){});
  
  setTimeout(function(){
    st.textContent='✅ Broadcast sent!';
    st.style.color='#66bb6a';
    document.getElementById('body').value='';
    document.getElementById('title').value='';
    // Also notify ALL open apps via service worker
    if('serviceWorker'in navigator){
      navigator.serviceWorker.ready.then(function(reg){
        reg.active.postMessage({type:'BROADCAST',title:t,body:b,id:broadcastId});
      });
      // Also show local notification
      if(Notification.permission==='granted'){
        navigator.serviceWorker.ready.then(function(reg){
          reg.showNotification('📢 '+t,{body:b,icon:'/icon-192.png',vibrate:[300,100,300],tag:'bc-'+broadcastId,requireInteraction:true});
        });
      }
    }
  }).catch(function(e){
    st.textContent='❌ Error: '+e.message;
    st.style.color='#ef5350';
  });
};

if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
